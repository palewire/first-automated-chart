[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "first-automated-chart"
version = "1.0.0"
description = "Learn how you can use Python and the Datawrapper API to create a limitless number of charts."
readme = "README.md"
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "exceptiongroup",
    "datawrapper>=2.1.0",
    "jupyterlab",
    "pandas",
    "altair",
    "pyarrow",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-click",
    "sphinx-rtd-theme",
    "sphinxcontrib-mermaid",
    "myst-parser",
    "sphinx-palewire-theme>=0.1.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "twine",
    "setuptools-scm",
    "pre-commit",
    "mypy",
    "types-requests",
    "typing-extensions",
    "flake8",
    "flake8-bugbear",
    "flake8-docstrings",
    "flake8-simplify",
    "pep8-naming",
    "tomli",
]

[tool.setuptools]
packages = []
